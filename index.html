<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveCode Dictionary</title>
    
    <!-- Bootstrap 3 (matches LC IDE) -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/solid.min.css" rel="stylesheet">
    
    <style>
        /* LC IDE Dictionary CSS (lcdoc.css) - exact match */
        html { overflow-y: scroll; }
        
        /* Fixed white spacer at top (matching LC IDE) */
        #lcnavbar-spacer { height: 15px; background-color: #ffffff; z-index: 200; }
        
        /* Navbar styling */
        .navbar-default { 
            background-color: #f8f8f8; 
            border-bottom: 1px solid #e6e6e6;
        }
        .navbar-default .navbar-brand { color: #333; font-weight: bold; }
        .navbar-default .navbar-nav > li > a { color: #333; }
        .navbar-default .navbar-nav > li.active > a, 
        .navbar-default .navbar-nav > li.active > a:hover, 
        .navbar-default .navbar-nav > li.active > a:focus {
            background-color: transparent;
            color: #337ab7;
        }
        .navbar-default .navbar-toggle { background-color: #f8f8f8; }
        .navbar-default .navbar-toggle .icon-bar {background-color: #333;}
        
        /* Sidebar styling */
        .bs-sidebar { 
            position: relative; 
            width: 100%;
        }
        
        /* Panel styling (LC IDE uses panel-default) */
        .panel-default { 
            border-color: #ddd; 
            border-top: none;
            margin-bottom: 15px;
        }
        .panel-heading { 
            background-color: #f8f8f8; 
            color: #333; 
            border-bottom: 1px solid #ddd;
            padding: 8px 15px;
        }
        .panel-title { 
            margin: 0; 
            font-size: 16px; 
            font-weight: 500;
        }
        .panel-body { padding: 10px 15px; }
        
        /* Entry list table (matching LC IDE) */
        #table_list_header { margin-bottom: 0; height: 30px; border-bottom: 1px solid #ddd; }
        #table_list { margin-bottom: 20px; }
        #table_list table { table-layout: fixed; width: 100%; }
        #table_list table th { 
            text-align: left;
            vertical-align: middle;
            background-color: #f8f8f8;
            border-bottom: 1px solid #ddd;
            border-top: 1px solid #ddd;
            height: 30px;
            padding: 0 10px;
        }
        #table_list table td { 
            vertical-align: middle;
            padding: 0 10px;
            border-bottom: 1px solid #ddd;
        }
        #table_list tr:hover { background-color: #f0f0f0; }
        #table_list tr.info { background-color: #e6f2ff; }
        #table_list tr.active { background-color: #d9edf7; }
        
        /* Column widths (LC IDE: 55% | 15% | 30%) */
        #table_list thead th:first-child,
        #table_list tbody td:first-child { width: 55%; }
        #table_list thead th:nth-child(2),
        #table_list tbody td:nth-child(2) { width: 15%; }
        #table_list thead th:nth-child(3),
        #table_list tbody td:nth-child(3) { width: 30%; }
        
        /* Type badges (matching LC IDE colors) */
        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            margin: 0 2px 0 0;
        }
        .badge-command { background-color: #dff0d8; color: #3c763d; }
        .badge-function { background-color: #fcf8e3; color: #8a6d3b; }
        .badge-property { background-color: #d9edf7; color: #31708f; }
        .badge-constant { background-color: #f2dede; color: #a94442; }
        
        /* Syntax block (LC IDE style) */
        .syntax-block {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: #333;
        }
        
        /* Example block */
        .example-block {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #333;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        /* Entry details panel */
        #lc-entry-details {
            margin-top: 20px;
        }
        .well-sm {
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        
        /* Filters panel */
        #type-filters label {
            font-size: 13px;
            padding: 2px 0;
            display: block;
        }
        
        /* Header resizer (drag bar) */
        #resizer {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 5px;
            cursor: ew-resize;
        }
        
        /* Hide unused elements */
        #filters_options { display: none; }
    </style>
</head>
<body>
    <!-- Fixed top spacer (matching LC IDE) -->
    <div id="lcnavbar-spacer"></div>
    
    <!-- Fixed Top Navbar (LC IDE style) -->
    <nav class="navbar navbar-default navbar-fixed-top" id="lcnavbar">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <span class="navbar-brand">API/Library</span>
            </div>
            <div class="collapse navbar-collapse" id="navbar">
                <ul class="nav navbar-nav">
                    <li class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown">LiveCode Script <span class="caret"></span></a>
                        <ul class="dropdown-menu" id="library-chooser-list">
                            <li><a href="#">LiveCode Script</a></li>
                            <li><a href="#">LiveCode Builder</a></li>
                            <li><a href="#">Data Grid</a></li>
                        </ul>
                    </li>
                </ul>
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="#" id="lc-nav-prev"><span aria-hidden="true" class="glyphicon glyphicon-chevron-left"></span> Previous</a></li>
                    <li><a href="#" id="lc-nav-next">Next <span aria-hidden="true" class="glyphicon glyphicon-chevron-right"></span></a></li>
                    <li><a href="#" id="lc-nav-history"><span aria-hidden="true" class="glyphicon glyphicon-time"></span> History</a></li>
                </ul>
                <form class="navbar-form navbar-right">
                    <div class="form-group">
                        <input type="text" class="form-control" id="lc-search" placeholder="Search..." spellcheck="false">
                    </div>
                    <button type="button" class="btn btn-default btn-sm"><span class="glyphicon glyphicon-search"></span></button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content Area (3-column layout) -->
    <div class="container-fluid" style="margin-top: 20px;">
        <div class="row">
            <!-- Left Sidebar (col-md-3, matching LC IDE) -->
            <div class="col-md-3">
                <div class="panel panel-default" id="filters_panel" style="position: sticky; top: 70px;">
                    <div class="panel-heading">
                        Filters
                        <button id="lc-clear-filter" class="btn btn-xs btn-default pull-right" style="display: none;">Clear</button>
                    </div>
                    <div class="panel-body" id="filters_container">
                        <div id="filters">none</div>
                        
                        <!-- Type Filters -->
                        <h4 style="margin-top: 15px; font-size: 14px; color: #666;">Type:</h4>
                        <div id="type-filters">
                            <label><input type="checkbox" class="filter-checkbox" data-type="command"> Command</label><br>
                            <label><input type="checkbox" class="filter-checkbox" data-type="function"> Function</label><br>
                            <label><input type="checkbox" class="filter-checkbox" data-type="property"> Property</label><br>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content (col-md-9) -->
            <div class="col-md-9">
                <!-- Entry List Panel -->
                <div id="lc_entry_list">
                    <div class="panel panel-default">
                        <div class="panel-heading">
                            <table id="table_list_header" class="table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Type</th>
                                        <th>Syntax</th>
                                    </tr>
                                </thead>
                            </table>
                        </div>
                        <div class="panel-body" style="padding: 0;">
                            <table class="table table-hover table-condensed" id="table_list">
                                <tbody>
                                    <tr>
                                        <td colspan="3" class="text-center text-muted">Loading dictionary database...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- Header resizer -->
                        <div id="resizer"></div>
                    </div>
                </div>

                <!-- Entry Details Panel -->
                <div class="panel panel-default" id="lc_entry_body" style="display: none;">
                    <div class="panel-body" id="api_entry">
                        <div id="entry_content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Glyphicons CSS (required for LC IDE style icons) -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap-glyphicons.min.css" rel="stylesheet">
    
    <!-- jQuery and Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
    <script>
        // === LC IDE Dictionary JavaScript Functionality ===
        var tState = {
            selected_api_id: 0,
            selected_entry_index: {},
            history: { list: [], selected_index: -1 },
            cached_search_data: {},
            filters: {},
            filtered_data: [],
            data: [],
            sort_type: "",
            edition: "livecode_script"
        };

        // Configuration - API URL and Key
        // The API_KEY should be set to your Supabase anon key
        // Find it at: https://supabase.com/dashboard/project/bkhvrqopgxjvztwjoalr/settings/api
        var LC_DICT_CONFIG = {
            SUPABASE_URL: 'https://bkhvrqopgxjvztwjoalr.supabase.co/rest/v1',
            API_KEY: 'YOUR_SUPABASE_ANON_KEY_HERE'
        };

        $(document).ready(function(e) {
            // Load config from meta tag if available
            var configMeta = $('meta[name="dict-config"]');
            if (configMeta.length > 0) {
                try {
                    LC_DICT_CONFIG = JSON.parse(configMeta.attr('content'));
                } catch(e) {}
            }
            
            // Initialize
            setTimeout(function() {
                loadDictionary();
                document.getElementById("lc_search").focus();
            }, 100);
        });

        /**
         * Load dictionary entries from Supabase (fallback to local data.json)
         */
        async function loadDictionary() {
            // First try Supabase API
            try {
                const response = await fetch(LC_DICT_CONFIG.SUPABASE_URL + '/dictionary', {
                    headers: {
                        'apikey': LC_DICT_CONFIG.API_KEY,
                        'Authorization': 'Bearer ' + LC_DICT_CONFIG.API_KEY
                    }
                });
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                
                const data = await response.json();
                tState.filtered_data = data;
                tState.data = data;
                renderTable(data);
                if (data.length > 0) {
                    selectEntry(0);
                }
                return;
            } catch (err) {
                console.warn('Supabase API failed, falling back to data.json:', err.message);
            }
            
            // Fallback to static JSON file
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                tState.filtered_data = data;
                tState.data = data;
                renderTable(data);
                if (data.length > 0) {
                    selectEntry(0);
                }
            } catch (err) {
                console.error('Error loading dictionary:', err);
                document.getElementById('table_list').innerHTML = 
                    '<tr><td colspan="3" class="text-center text-danger py-4">' +
                        'Error loading dictionary: ' + err.message + '</td></tr>';
            }
        }

        /**
         * Render the entry table (LC IDE style)
         */
        function renderTable(data) {
            const tbody = document.getElementById('table_list');
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4">No matching entries found.</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(item => {
                const typeName = item.type || 'command';
                const typeClass = getTypeClass(typeName);
                const syntax = item.syntax || '';
                
                return '<tr data-entry-id="' + item.id + '">' +
                    '<td class="entry-name">' + escapeHtml(item.keyword || '') + '</td>' +
                    '<td><span class="type-badge ' + typeClass + '">' + escapeHtml(typeName) + '</span></td>' +
                    '<td class="text-muted">' + escapeHtml(syntax) + '</td>' +
                '</tr>';
            }).join('');
        }

        /**
         * Get CSS class for entry type
         */
        function getTypeClass(type) {
            const t = (type || '').toLowerCase();
            if (t.includes('command') || t.includes('dialog')) return 'badge-command';
            if (t.includes('function')) return 'badge-function';
            if (t.includes('property')) return 'badge-property';
            if (t.includes('constant')) return 'badge-constant';
            return 'badge-command';
        }

        /**
         * Select entry by index
         */
        function selectEntry(index) {
            const entries = document.querySelectorAll('#table_list tbody tr');
            if (index < 0 || index >= entries.length) return;
            
            // Remove highlight from all
            entries.forEach(tr => tr.classList.remove('info'));
            
            // Highlight selected
            entries[index].classList.add('info');
            
            const item = tState.filtered_data[index];
            if (item) {
                renderEntryDetails(item);
            }
        }

        /**
         * Render entry details (LC IDE style)
         */
        function renderEntryDetails(item) {
            const content = document.getElementById('api_entry');
            if (!content) return;
            
            const type = item.type || 'command';
            const typeClass = getTypeClass(type);
            
            // Build HTML matching LC IDE format
            let html = '<div class="well well-sm"><strong>Type:</strong> <span class="type-badge ' + typeClass + '">' + escapeHtml(type) + '</span></div>';
            
            // Syntax
            if (item.syntax) {
                html += '<div style="margin-bottom: 15px;"><strong style="color: #337ab7;">Syntax:</strong><br>' +
                    '<div class="syntax-block">' + escapeHtml(item.syntax) + '</div></div>';
            }
            
            // LiveCode Syntax (if different from SE syntax)
            if (item.livecode_syntax && item.livecode_syntax !== item.syntax) {
                html += '<div style="margin-bottom: 15px;"><strong style="color: #337ab7;">LiveCode Syntax:</strong><br>' +
                    '<div class="syntax-block">' + escapeHtml(item.livecode_syntax) + '</div></div>';
            }
            
            // Description
            if (item.description || item.summary) {
                const desc = (item.description || item.summary || '').replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
                html += '<div style="margin-bottom: 15px;"><strong style="color: #337ab7;">Description:</strong>' +
                    '<div style="margin: 8px 0 0 0;">' + desc + '</div></div>';
            }
            
            // Parameters
            let params = [];
            try {
                params = JSON.parse(item.parameters || '[]');
            } catch(e) {}
            
            if (params.length > 0) {
                html += '<div style="margin-bottom: 15px;"><strong style="color: #337ab7;">Parameters:</strong>' +
                    '<table class="table table-bordered table-condensed" style="font-size: 12px; margin: 8px 0 0 0;">' +
                    '<tbody>' + params.map(p => 
                        '<tr><td style="width: 40%; font-weight: 500;">' + escapeHtml(p.name || '') + 
                        '</td><td>' + escapeHtml(p.description || '') + '</td></tr>'
                    ).join('') +
                    '</tbody></table></div>';
            }
            
            // Return Value
            if (item.return_value) {
                html += '<div style="margin-bottom: 15px;"><strong style="color: #337ab7;">Return Value:</strong>' +
                    '<div style="margin: 8px 0 0 0;">' + escapeHtml(item.return_value) + '</div></div>';
            }
            
            // Examples
            let examples = [];
            try {
                examples = JSON.parse(item.example || '[]');
            } catch(e) {}
            
            if (examples.length > 0) {
                html += '<div style="margin-bottom: 15px;"><strong style="color: #337ab7;">Examples:</strong>' +
                    '<div class="example-block">' + examples.map(e => 
                        escapeHtml(typeof e === 'string' ? e : e.content || e)
                    ).join('<div style="margin-bottom: 8px;"></div>') + '</div></div>';
            }
            
            content.innerHTML = html;
            document.getElementById('lc_entry_body').style.display = 'block';
        }

        /**
         * Escape HTML special characters
         */
        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Handle table row clicks
        document.getElementById('table_list').addEventListener('click', function(e) {
            const tr = e.target.closest('tr');
            if (!tr) return;
            
            const index = Array.from(tr.parentNode.children).indexOf(tr);
            if (index >= 0) {
                selectEntry(index);
            }
        });
    </script>
</body>
</html>
